{% extends "base.html" %}

{% block title %}
    Excluir Categoria
{% endblock %}

{% block content %}

    <h2>
        Excluir Categoria
    </h2>

    <p>

        Tem certeza que deseja excluir a categoria

        <strong>
            {{ object.nome }}
        </strong>?

    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Sim, excluir
        </button>

        <a href="{% url 'estoque:categoria_lista' %}">
            Cancelar
        </a>

    </form>

{% endblock %}
