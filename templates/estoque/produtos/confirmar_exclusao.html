{% extends "base.html" %}


{% block title %}
    Excluir produto
{% endblock %}


{% block content %}

    <h1>
        Excluir produto
    </h1>


    <p>
        Você tem certeza que deseja excluir o produto
        <strong>{{ object.nome }}</strong>?
    </p>


    <p>
        Essa ação não poderá ser desfeita.
    </p>


    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Sim, excluir produto
        </button>


        <a href="{% url 'estoque:produto_lista' %}">
            Cancelar
        </a>

    </form>

{% endblock %}
